<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radix splats</title>
    <style>
      :root {
        --panel: rgba(18, 20, 26, 0.86);
        --text: #e6e9ef;
        --muted: #98a1b3;
        --accent: #3d6bd8;
        --accent-hover: #4a78e4;
        --ui-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #ddd;
        font: 12px var(--ui-font);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* Quick bar: the likely options, top left, clear of the panel */
      #bar {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: calc(100vw - 340px - 36px);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px;
        border-radius: 10px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
      }
      .bar-group {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
      }
      .bar-label {
        padding: 0 6px 0 4px;
        color: var(--muted);
        font-size: 11px;
      }
      #bar button,
      #bar input,
      #bar select {
        height: 22px;
        padding: 0 8px;
        border: 0;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
        font: 11px var(--ui-font);
        outline: none;
        cursor: pointer;
      }
      #bar button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.13);
      }
      #bar button.active {
        background: var(--accent);
        color: #fff;
      }
      #bar button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #bar button.active:disabled {
        opacity: 0.75;
      }
      #bar input {
        width: 110px;
        font-family: var(--mono);
        cursor: text;
      }
      #bar input:focus {
        background: rgba(255, 255, 255, 0.14);
      }
      #bar select {
        padding: 0 4px;
      }
      #bar select option {
        background: #1c1f24;
      }
      .bar-stats {
        padding: 0 8px;
        color: #9fd3ff;
        font: 11px var(--mono);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(18, 20, 26, 0.72);
        backdrop-filter: blur(8px);
        color: #aab2c0;
        font: 11px/1.5 var(--mono);
        pointer-events: none;
        white-space: pre;
      }
      #status:empty {
        display: none;
      }

      /* Drop overlay while files are dragged over the page */
      #drop {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(20, 40, 90, 0.35);
        pointer-events: none;
      }
      #drop.visible {
        display: flex;
      }
      #drop div {
        padding: 28px 40px;
        border: 2px dashed rgba(255, 255, 255, 0.6);
        border-radius: 16px;
        background: var(--panel);
        color: var(--text);
        font-size: 16px;
      }

      /* Error messages, bottom center */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: min(640px, calc(100vw - 32px));
      }
      .toast-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 8px 8px 12px;
        border-radius: 8px;
        background: rgba(120, 24, 32, 0.92);
        color: #fff;
        font: 12px/1.4 var(--mono);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
      }
      .toast-item button {
        border: 0;
        background: none;
        color: #fff;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }

      /* Tweakpane panel */
      :root {
        --tp-base-background-color: var(--panel);
        --tp-base-shadow-color: rgba(0, 0, 0, 0.45);
        --tp-base-border-radius: 10px;
        --tp-base-font-family: var(--ui-font);
        --tp-blade-border-radius: 5px;
        --tp-blade-horizontal-padding: 6px;
        --tp-blade-value-width: 160px;
        --tp-container-unit-size: 22px;
        --tp-container-unit-spacing: 5px;
        --tp-container-horizontal-padding: 6px;
        --tp-container-vertical-padding: 5px;
        --tp-container-background-color: rgba(255, 255, 255, 0.06);
        --tp-container-background-color-hover: rgba(255, 255, 255, 0.1);
        --tp-container-background-color-focus: rgba(255, 255, 255, 0.12);
        --tp-container-background-color-active: rgba(255, 255, 255, 0.16);
        --tp-container-foreground-color: var(--text);
        --tp-button-background-color: var(--accent);
        --tp-button-background-color-hover: var(--accent-hover);
        --tp-button-background-color-focus: #5584ee;
        --tp-button-background-color-active: #6390f5;
        --tp-button-foreground-color: #fff;
        --tp-input-background-color: rgba(255, 255, 255, 0.07);
        --tp-input-background-color-hover: rgba(255, 255, 255, 0.11);
        --tp-input-background-color-focus: rgba(255, 255, 255, 0.14);
        --tp-input-background-color-active: rgba(255, 255, 255, 0.18);
        --tp-input-foreground-color: var(--text);
        --tp-label-foreground-color: var(--muted);
        --tp-monitor-background-color: rgba(0, 0, 0, 0.28);
        --tp-monitor-foreground-color: #9fd3ff;
        --tp-groove-foreground-color: rgba(255, 255, 255, 0.1);
      }
      .tp-dfwv {
        top: 12px !important;
        right: 12px !important;
        width: 340px !important;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        border-radius: 10px;
        backdrop-filter: blur(10px);
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      }
      .tp-dfwv .tp-lblv_l {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tp-dfwv .tp-mllv_i,
      .tp-dfwv .tp-sglv_i,
      .tp-dfwv .tp-txtv_i {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "../../../node_modules/three/build/three.webgpu.js",
          "three/webgpu": "../../../node_modules/three/build/three.webgpu.js",
          "three/tsl": "../../../node_modules/three/build/three.tsl.js",
          "three/examples/jsm/": "../../../node_modules/three/examples/jsm/",
          "@sparkjsdev/radix": "../../../dist/radix.module.js",
          "tweakpane": "../../../node_modules/tweakpane/dist/tweakpane.js",
          "@tweakpane/plugin-essentials": "../../../node_modules/@tweakpane/plugin-essentials/dist/tweakpane-plugin-essentials.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="bar"></div>
    <div id="status"></div>
    <div id="toast"></div>
    <div id="drop"><div>Drop a .ply, .spz, .rad or .rdx file</div></div>
    <input id="picker" type="file" accept=".ply,.spz,.rad,.rdx" hidden />
    <script type="module" src="./main.js"></script>
  </body>
</html>
