<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radix SPZ reader / writer</title>
    <style>
      :root {
        --panel: rgba(18, 20, 26, 0.86);
        --text: #e6e9ef;
        --muted: #98a1b3;
        --accent: #3d6bd8;
        --ui-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #ddd;
        font: 12px var(--ui-font);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      button,
      input,
      select {
        height: 22px;
        padding: 0 8px;
        border: 0;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
        font: 11px var(--ui-font);
        outline: none;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.13);
      }
      button.active {
        background: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      select option {
        background: #1c1f24;
      }

      /* Quick bar, top left, clear of the panel */
      #bar {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: calc(100vw - 340px - 36px);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px;
        border-radius: 10px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
      }
      .bar-group {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
      }
      .bar-label {
        padding: 0 6px 0 4px;
        color: var(--muted);
        font-size: 11px;
      }
      #bar input {
        width: 110px;
        font-family: var(--mono);
        cursor: text;
      }
      .bar-stats {
        padding: 0 8px;
        color: #9fd3ff;
        font: 11px var(--mono);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* What the reader found, and the writer, top right */
      #panel {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 340px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 4px 12px 10px;
        border-radius: 10px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        color: var(--text);
      }
      #panel h2 {
        margin: 10px 0 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #panel dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 3px 10px;
        margin: 0;
      }
      #panel dt {
        color: var(--muted);
      }
      #panel dd {
        margin: 0;
        font: 11px var(--mono);
        word-break: break-word;
      }
      #panel .note {
        margin: 6px 0;
        color: var(--muted);
        line-height: 1.45;
      }
      #panel .row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        margin: 6px 0;
      }
      #panel .mono {
        font: 11px var(--mono);
      }
      #panel label {
        color: var(--muted);
        cursor: pointer;
      }
      #panel input[type="checkbox"] {
        height: auto;
        vertical-align: middle;
      }
      #credit {
        position: fixed;
        right: 12px;
        bottom: 10px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 11px;
      }
      #credit a {
        color: inherit;
      }

      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(18, 20, 26, 0.72);
        backdrop-filter: blur(8px);
        color: #aab2c0;
        font: 11px/1.5 var(--mono);
        pointer-events: none;
        white-space: pre;
      }
      #status:empty {
        display: none;
      }
      #drop {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(20, 40, 90, 0.35);
        pointer-events: none;
      }
      #drop.visible {
        display: flex;
      }
      #drop div {
        padding: 28px 40px;
        border: 2px dashed rgba(255, 255, 255, 0.6);
        border-radius: 16px;
        background: var(--panel);
        color: var(--text);
        font-size: 16px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: min(640px, calc(100vw - 32px));
      }
      .toast-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 8px 8px 12px;
        border-radius: 8px;
        background: rgba(120, 24, 32, 0.92);
        color: #fff;
        font: 12px/1.4 var(--mono);
      }
      .toast-item button {
        background: none;
        color: #fff;
        font-size: 16px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.webgpu.js",
          "three/webgpu": "/node_modules/three/build/three.webgpu.js",
          "three/tsl": "/node_modules/three/build/three.tsl.js",
          "three/examples/jsm/": "/node_modules/three/examples/jsm/",
          "@sparkjsdev/radix": "/dist/radix.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="bar"></div>
    <div id="panel"></div>
    <div id="status"></div>
    <div id="toast"></div>
    <div id="credit">Samples: <a href="https://github.com/raymondyfei/SharedTestModels" target="_blank" rel="noopener">SharedTestModels</a> (CC0)</div>
    <div id="drop"><div>Drop a .spz (or .ply, .rad, .rdx) file</div></div>
    <input id="picker" type="file" accept=".spz,.ply,.rad,.rdx" hidden />
    <script type="module" src="./main.js"></script>
  </body>
</html>
