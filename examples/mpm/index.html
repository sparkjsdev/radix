<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radix MPM water</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font: 12px/1.4 ui-monospace, monospace;
        color: #ddd;
      }
      canvas {
        display: block;
      }
      #status {
        position: fixed;
        top: 12px;
        left: 12px;
        margin: 0;
        white-space: pre-wrap;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #needs-webgpu {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(32rem, 85vw);
        height: fit-content;
        padding: 16px 20px;
        font: 15px/1.5 system-ui, sans-serif;
        background: #1a1a20;
        border: 1px solid #555;
        border-radius: 6px;
      }
      #needs-webgpu h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      #needs-webgpu a {
        color: #9cf;
      }
      #needs-webgpu code {
        white-space: nowrap;
      }

      html, body, canvas {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }

      .lil-gui {
        --width: min(340px, 85vw);
        --name-width: 9rem;
        --title-background-color: rgba(0, 0, 0, 0.5);
        --background-color: rgba(0, 0, 0, 0.15);
        --widget-color: rgba(0, 0, 0, 0.3);
        --hover-color: rgba(0, 0, 0, 0.45);
        --focus-color: rgba(0, 0, 0, 0.6);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .lil-gui.root {
        top: 0;
        right: 0;
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
      }
      .lil-gui .slider,
      .lil-gui input[type="checkbox"] {
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.webgpu.js",
          "three/webgpu": "/node_modules/three/build/three.webgpu.js",
          "three/tsl": "/node_modules/three/build/three.tsl.js",
          "three/examples/jsm/": "/node_modules/three/examples/jsm/",
          "@sparkjsdev/radix": "/dist/radix.module.js",
          "lil-gui": "/node_modules/lil-gui/dist/lil-gui.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <pre id="status">Loading...</pre>
    <div id="needs-webgpu" hidden>
      <h1>This example needs WebGPU</h1>
      The water is simulated in WebGPU compute shaders, which the WebGL2 backend does not have. Open it in a browser with
      WebGPU, without <code>?gpu=webgpu-gl</code>: <a href="index.html">MPM water on WebGPU</a>.
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
