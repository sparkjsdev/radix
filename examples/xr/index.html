<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radix WebXR</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      #status {
        position: fixed;
        top: 10px;
        left: 12px;
        margin: 0;
        color: #ddd;
        font: 12px/1.4 monospace;
        text-shadow: 0 1px 2px #000;
        white-space: pre;
        pointer-events: none;
        z-index: 2;
      }
      #enter {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid #fff;
        border-radius: 4px;
        font: 14px monospace;
        cursor: pointer;
        z-index: 2;
      }
      #enter:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #enter[hidden] {
        display: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.webgpu.js",
          "three/webgpu": "/node_modules/three/build/three.webgpu.js",
          "three/tsl": "/node_modules/three/build/three.tsl.js",
          "three/examples/jsm/": "/node_modules/three/examples/jsm/",
          "@sparkjsdev/radix": "/dist/radix.module.js"
        }
      }
    </script>
  </head>
  <body>
    <pre id="status">Loading...</pre>
    <button id="enter" hidden>Enter VR</button>
    <script type="module" src="./main.js"></script>
  </body>
</html>
